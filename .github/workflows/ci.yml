## CI (build + testes) e validacao do ambiente Docker (PostgreSQL + Redis + App) no GitHub Actions.

name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: oracle
          cache: maven

      - name: Build
        run: ./mvnw verify -B

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Subir ambiente Docker (PostgreSQL, Redis e Aplicacao)
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Aguardar boot e validar health (/q/health/ready)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/q/health/ready; then
              echo ""
              echo "Aplicacao pronta e saudavel!"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Encerrar containers
        if: always()
        run: docker compose down -v